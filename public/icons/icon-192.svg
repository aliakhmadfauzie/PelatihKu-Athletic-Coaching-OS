<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141b2b"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Dumbbell / Athletic Shield Icon -->
  <g transform="translate(40, 40)" filter="url(#glow)">
    <!-- Dumbbell Outer Plates Left -->
    <rect x="8" y="24" width="10" height="64" rx="4" fill="url(#emeraldGrad)" />
    <rect x="22" y="32" width="8" height="48" rx="3" fill="url(#emeraldGrad)" opacity="0.85" />
    
    <!-- Central Bar -->
    <rect x="30" y="51" width="52" height="10" rx="3" fill="#ffffff" />
    
    <!-- Dumbbell Outer Plates Right -->
    <rect x="82" y="32" width="8" height="48" rx="3" fill="url(#emeraldGrad)" opacity="0.85" />
    <rect x="94" y="24" width="10" height="64" rx="4" fill="url(#emeraldGrad)" />

    <!-- Center Badge Accent -->
    <circle cx="56" cy="56" r="14" fill="#0B0F17" stroke="url(#emeraldGrad)" stroke-width="3" />
    <polygon points="56,48 62,60 50,60" fill="url(#emeraldGrad)" />
  </g>

  <!-- Bottom Label -->
  <text x="96" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#4edea3" letter-spacing="2">PELATIHKU</text>
</svg>
